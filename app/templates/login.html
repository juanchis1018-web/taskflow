{% extends "base.html" %}{% block title %}Ingresar · TaskFlow{% endblock %}
{% block content %}
<div class="card auth">
  <h2>Iniciar sesión</h2>
  <form method="post">
    <label for="username">Usuario</label><input id="username" name="username" required>
    <label for="password">Contraseña</label><input id="password" name="password" type="password" required>
    <p><button type="submit" id="btn-login">Ingresar</button></p>
  </form>
  <p>¿No tiene cuenta? <a href="{{ url_for('register') }}">Regístrese</a></p>
</div>
{% endblock %}
